<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231e40af'/><text x='16' y='24' text-anchor='middle' font-size='20' fill='%23fbbf24' font-weight='bold'>B</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brolay Toxic Standings</title>
    <style>
      .dropdown {
        position: relative;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 50;
        min-width: 200px;
        margin-top: 0.5rem;
        padding-top: 0.5rem;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }

      .dropdown.dropdown-open .dropdown-content {
        display: block;
      }

      .dropdown-content:hover {
        display: block;
      }

      /* Keep dropdown visible when hovering over the area between button and content */
      .dropdown::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        height: 0.5rem;
      }

      .dropdown-content::before {
        content: '';
        position: absolute;
        top: -0.5rem;
        left: 0;
        right: 0;
        height: 0.5rem;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
